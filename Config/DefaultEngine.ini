[URL]
GameName=WoT

[/Script/Engine.Engine]
; Code-only host for the nineteen generated neutral shells. The guarded source
; engine still owns every pre-play choke point, including both seamless roles.
GameEngine=/Script/WoT.WoTGameEngine
LocalPlayerClassName=/Script/WoT.WoTLocalPlayer
GameViewportClientClassName=/Script/WoT.WoTGameViewportClient
; Net drivers are declared on the class that OWNS the property (UEngine), as a
; replacement of the base list: UEngine::CreateNamedNetDriver takes the FIRST
; definition whose DefName matches (UnrealEngine.cpp FindByPredicate). The
; GameNetDriver is EOS P2P with an IpNetDriver fallback. NetDriverEOS is itself
; an IpNetDriver: it passes through to plain IP for a non-EOS connect host and
; for a listen URL carrying ?bIsLanMatch (NetDriverEOS.cpp InitConnect /
; InitListen), and it reports unavailable - so the fallback IpNetDriver is
; created - whenever no EOS socket subsystem exists (no EOS login this run,
; -NoEOS, missing SDK) or on a dedicated server (NetDriverEOS::IsAvailable).
; LAN and direct IP therefore never depend on EOS. The beacon/demo rows restore
; the engine's own defaults (BaseEngine.ini [/Script/Engine.Engine]).
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SocketSubsystemEOS.NetDriverEOS",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="BeaconNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/WoT/Maps/WoTFrontEnd
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/WoT.WoTGameMode
GameInstanceClass=/Script/WoT.WoTGameInstance
; Retail selects the game type by map prefix (giMPBattle.MapPrefix): every
; Battle2_/Battle3_/Battle4_ citadel map boots giMPBattle. Without this rule
; a direct Battle map launch (PIE, -game) ran the Arena free-for-all mode.
+GameModeMapPrefixes=(Name="Battle",GameMode="/Script/WoT.WoTBattleGameMode")

[/Script/Engine.RendererSettings]
; Forward+, no temporal AA of any kind (TAA/TSR). MSAA OFF for now: the
; goldens are aliased, and 1 sample/pixel keeps geometry sampling
; golden-identical while the pixel-accurate pipeline is being proven.
; MSAA returns later as a measured presentation improvement.
r.ForwardShading=True
r.AntiAliasingMethod=0
r.MSAACount=1
; Period look: no Lumen, no eye adaptation, no bloom — the original
; was baked lightmaps with fixed exposure. Baked Lightmass pass comes later.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; SM6 features the port never uses still compile global shaders into every
; SM6 archive (Metal SM6 on the Mac): no mesh carries Nanite data (all
; geometry is built at runtime) and MegaLights cannot run under forward
; shading (RenderUtils.cpp ShouldCompileMegaLightsShaders ignores that).
r.Nanite.ProjectEnabled=False
r.MegaLights.Supported=False
; No filmic/ACES tone curve: UE1 had no tonemapper, and the S-curve is a
; measured source of golden-set mismatch (reference comparison:
; UE ~= golden^0.5 before this change). Output stays plain sRGB encode.
r.Tonemapper.Quality=0
r.ToneCurveAmount=0
; GPU Lightmass RT/DX12 settings live in Config/Windows/WindowsEngine.ini
; (platform-scoped so the Mac editor stays healthy).
r.DefaultFeature.AutoExposure=False
; even with auto-exposure off, the default bias is 1 EV (x2) — measured via
; emissive swatches. 0 = output is the pure sRGB encode of scene linear.
r.DefaultFeature.AutoExposure.Bias=0

; GAMMA-SPACE scheme note: scene color holds display-encoded values
; (textures sample raw, shaders/blending run in display space — UE1/Glide
; semantics). The ideal boundary is a non-sRGB swapchain / identity output
; transform, but the 5.8 LDR desktop path ignores r.TonemapperGamma and
; r.HDR.Display.OutputDevice (measured: cvars set, output unchanged), so
; the boundary is a post-process at BL_SCENE_COLOR_BEFORE_BLOOM applying
; the exact piecewise sRGB DECODE — the tonemapper's piecewise encode then
; inverts it byte-exactly (a plain pow(2.2) mis-cancels the sRGB toe).
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
; Retail PF_Mirrored surfaces (Source/WoT/World/WoTRuntimeMirror.h): the mirror
; capture clips at the mirror plane like UE1's child-frame NearClip
; (the original renderer and mesh renderer). UE only honours a view clip plane when
; every surface shader carries it (Common.ush USE_GLOBAL_CLIP_PLANE): one
; SV_ClipDistance output per vertex, a vertex-stage cost that is negligible for
; 1999 triangle counts on SM5/SM6/Metal. Platforms without clip-distance
; support (DataDrivenPlatformInfo bSupportsClipDistance=false, e.g.
; VULKAN_ES3_1_ANDROID) turn it into a per-pixel clip() in every mobile base
; pass (MobileBasePassPixelShader.usf:357): a Frame build on that path must set
; this to False for its platform; the runtime then keeps the plain sheet.
; Changing it recompiles every shader.
r.AllowGlobalClipPlane=True

[ConsoleVariables]
; Developer opt-in only. -WoTPayloadInjection enables the same local seam for
; headless runs; no payload state enters gameplay or replication.
wot.PayloadInjection=0

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


[/Script/Engine.CollisionProfile]
; UE1 projectile semantics: HitWall on world geometry (block), Touch on pawns
; (overlap). Referenced by AWoTProjectile's SetCollisionProfileName.
; Projectiles carry their OWN object channel (WoTProjectile) and overlap each
; other: retail weaves pass through one another (the Touch filter rejects a
; non-bProjTarget projectile), and an armed ward (bProjTarget) detonates via
; the overlap/Touch path. As WorldDynamic they mutually BLOCKED - two crossing
; weaves exploded on each other. World geometry and
; movers (WorldDynamic) still block: HitWall/NotifyHit unchanged.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="WoTProjectile")
+Profiles=(Name="Projectile",CollisionEnabled=QueryOnly,ObjectTypeName="WoTProjectile",CustomResponses=((Channel="Pawn",Response=ECR_Overlap),(Channel="WoTProjectile",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore)),HelpMessage="WoT projectile: blocks world, overlaps pawns and other weaves",bCanModify=true)

[/Script/NavigationSystem.RecastNavMesh]
; NavMesh tiles generate at map load (bounds volumes are placed by
; import_map.py; editor-time nav builds don't run under the commandlet).
; Powers AWoTSeekingProjectile's blocked-route path fallback.
RuntimeGeneration=Dynamic

; --- Online services. LAN + direct IP: the Null OSS + IpNetDriver, always
; available. Internet play: Epic Online Services (OSS v1 "EOS", EOS Connect
; Device ID - no Epic account - EOS Lobbies as the server list, EOS P2P with
; NAT traversal and relay fallback). EOS is NOT the default service: the
; default OSS is created at OnlineSubsystem module startup, before the
; bootstrap gate, so UWoTSessionSubsystem fetches the "EOS" instance by name
; only on an internet action after CanUseAuthorizedWorld. Startup and the
; first-run funnel make no internet traffic: the only network use there is
; LAN installer sharing, which talks to private (local-network) addresses
; only. See PORT_NOTES "Internet play through Epic Online Services" and "The
; game can share the original installer on the local network".
[OnlineSubsystem]
DefaultPlatformService=Null
; One explicit compatibility number for every WoT build, whatever engine built
; it: GetBuildUniqueId() feeds the Null LAN filter and the EOS lobby bucket, and
; would otherwise be the engine CompatibleChangelist (0 for the source engine,
; 55116800 for the installed 5.8.2), splitting Mac/Windows/dev builds into
; mutually invisible lists. The real compatibility gate stays the WoT network
; version handshake (WoTNetVersion); the browser flags a mismatch per row.
bUseBuildIdOverride=True
BuildIdOverride=1999

[OnlineSubsystemEOS]
bEnabled=True

[/Script/OnlineSubsystemEOS.EOSSettings]
; NO credentials in the repository. Tools/dist/build_stripped_pak.py writes ONE
; artifact row into the STAGED config of each package, from the local file
; %USERPROFILE%\.wot-secrets\eos-credentials.json (or %WOT_EOS_CREDENTIALS%):
; "WoTTest" (DeploymentIdTest) for Test packages, "WoT" (DeploymentIdPublic)
; for Shipping (Tools/dist/eos_credentials.py). Without it the game reports
; "Internet play is not configured in this build" and never creates the EOS
; platform; LAN and direct IP are unaffected.
DefaultArtifactName=WoT
bUseEAS=False
bUseEOSConnect=True
bUseEOSRTC=False
bEnableOverlay=False
bEnableSocialOverlay=False
bEnableEditorOverlay=False
bPreferPersistentAuth=False
!AuthScopeFlags=ClearArray
; OnlineSubsystemEOS initially composes this with its platform cache base.
; Guarded WoT game startup replaces the final EOS_Platform_Options path with
; <DataRoot>/Online/EOS before the platform is created.
CacheDir=CacheDir

[EOSSDK]
ProductName=WoTReborn
; bDllLoadFailureIsFatal stays False (default): a missing EOSSDK library only
; disables internet play.

[SocketSubsystemEOS]
bEnable=True
; Prefer a DIRECT peer-to-peer path; EOS relays only when NAT traversal fails.
; (ForceRelays would hide peer IPs at a latency cost; NoRelays never relays.)
RelayControl=AllowRelays

[/Script/SocketSubsystemEOS.NetDriverEOS]
NetConnectionClassName="/Script/SocketSubsystemEOS.NetConnectionEOS"

; --- Steam OSS + SDR, DORMANT. The plugins stay in the
; uproject and the settings below are kept, but Steam is neither the default
; service nor enabled: SteamSockets' StartupModule creates the Steam OSS through
; IOnlineSubsystem::Get(STEAM_SUBSYSTEM) whenever it is enabled, and the EOS OSS
; falls back to loading Steam as its "platform OSS". To revive it: bEnabled=True,
; DefaultPlatformService=Steam, and a SteamSockets GameNetDriver definition
; ahead of the EOS row in [/Script/Engine.Engine]. Dev appid 480 (spacewar)
; cannot ship.
[OnlineSubsystemSteam]
bEnabled=False
SteamDevAppId=480
bInitServerOnClient=True

[/Script/SteamSockets.SteamSocketsNetDriver]
NetConnectionClassName="SteamSockets.SteamSocketsNetConnection"

; Mac app identity. UBT's Xcode project reads exactly this key
; (UnrealBuildTool/ProjectFiles/Xcode/XcodeProject.cs:525-534); unset, it
; falls back to $(UE_SIGNING_PREFIX).$(UE_PRODUCT_NAME_STRIPPED), i.e. the
; placeholder com.YourCompany.WoT that every UE sample app shares. macOS keys
; per-app privacy decisions (Local Network) on this identifier, so changing it
; resets them: players get a fresh Local Network prompt on first LAN use.
[/Script/MacTargetPlatform.XcodeProjectSettings]
BundleIdentifier=com.aleiby.wot

