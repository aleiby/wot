[/Script/Engine.RendererSettings]
; No hardware ray tracing. It was on only for GPU Lightmass baking
; (Tools/import/bake_map.py), which the decoded UE1 lightmaps superseded
; (Tools/import/import_all.py "Excluded by design"); no runtime effect uses it.
r.RayTracing=False
r.SkinCache.CompileShaders=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; The game (and editor) default to D3D11: on AMD integrated GPUs the D3D12
; driver path grew a first run past 16 GB of RAM, D3D11 peaks near 2 GB and
; renders identically (PORT_NOTES "Windows graphics API"). D3D12 is cooked at
; SM5 (the engine default): every player runs D3D11/SM5 and -dx12 still works,
; while the SM6 shader archives were ~90 MB of each Windows download.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
D3D12TargetedShaderFormats=PCD3D_SM5
